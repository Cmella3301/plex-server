version: "3.8"
networks:
  media-network:
    driver: bridge

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    networks:
      - media-network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - PLEX_CLAIM=claim-tgd-QxGHsaHsfCUTAZUh
      - VERSION=docker
    volumes:
      - ./config:/config
      - "D:\\PlexMedia:/data"
    ports:
      - "32400:32400/tcp"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - media-network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./radarr-config:/config
      - "D:\\PlexMedia:/data"
    ports:
      - "7878:7878/tcp"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - media-network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./sonarr-config:/config
      - "D:\\PlexMedia:/data"
    ports:
      - "8989:8989/tcp"
    restart: unless-stopped

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    networks:
      - media-network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - DELUGE_USER=admin
      - DELUGE_PASS=adminadmin
    volumes:
      - ./deluge-config:/config
      - "D:\\PlexMedia:/data"
    ports:
      - "8112:8112"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - media-network
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./prowlarr-config:/config
    ports:
      - "9696:9696/tcp"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks:
      - media-network
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    ports:
      - "8191:8191"
    restart: unless-stopped
